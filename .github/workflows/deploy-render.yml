name: Deploy to Render

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # Or a similar environment defined in GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Render
        # Render has native integration with GitHub, typically you don't need a custom action for this.
        # Ensure your Render service is connected to your GitHub repository and set to auto-deploy from 'main' branch.
        # This step is often just a placeholder to indicate the action takes place via Render's integration.
        run: echo "Render service is configured for auto-deploy from GitHub."
        # If you were using Render's API for deployment, it would look something like:
        # - name: Trigger Render Deploy
        #   run: |
        #     curl -X POST -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
        #     https://api.render.com/v1/services/<YOUR_RENDER_SERVICE_ID>/deploys
        #   env:
        #     RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        #     RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

      - name: Wait for deployment and run health check
        # This step assumes a successful deployment on Render and waits for the app to be available.
        # You would replace `YOUR_RENDER_APP_URL` with your actual application URL.
        run: |
          sleep 60 # Give Render some time to deploy
          HEALTH_URL="https://YOUR_RENDER_APP_URL/health"
          echo "Checking health endpoint at: $HEALTH_URL"
          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
            if [ "$STATUS_CODE" == "200" ]; then
              echo "Health check passed!"
              exit 0
            else
              echo "Health check failed with status code $STATUS_CODE. Retrying in 10 seconds..."
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT+1))
            fi
          done
          echo "Health check failed after $MAX_RETRIES retries."
          exit 1