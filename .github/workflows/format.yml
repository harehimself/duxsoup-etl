name: Format Code

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (check only)
        # Assuming you have Prettier installed and a script like `npm run format:check`
        # This checks for formatting issues without changing files.
        run: |
          # npm install prettier # Uncomment if Prettier is not a dev dependency and needed here
          # npx prettier --check .
          echo "Prettier check step - implement your format check command here (e.g., npx prettier --check .)"
