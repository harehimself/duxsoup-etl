name: Format Code

on:
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (check only)
        # Assuming you have Prettier installed and a script like `npm run format:check`
        # This checks for formatting issues without changing files.
        run: |
          # npm install prettier # Uncomment if Prettier is not a dev dependency and needed here
          # npx prettier --check .
          echo "Prettier check step - implement your format check command here (e.g., npx prettier --check .)"
