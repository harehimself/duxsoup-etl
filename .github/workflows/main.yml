name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20' # LTS version, matches .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Replace with your actual test command once tests are implemented
        run: npm test

      - name: Run linting
        # Assuming you have an ESLint setup and a script like `npm run lint`
        run: |
          # npm install eslint # Uncomment if ESLint is not a dev dependency and needed here
          # npm run lint
          echo "Linting step - implement your lint command here (e.g., npm run lint)"

      - name: Dependency Vulnerability Scan
        # Example using a common action like `npm audit`
        run: npm audit --audit-level=moderate || true # Allow audit to fail without failing workflow